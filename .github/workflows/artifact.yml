name: Artifact

on:
  workflow_call:
    inputs:
      vsix-artifact:
        description: Name of the internal .vsix artifact uploaded by package.yml
        required: true
        type: string

jobs:
  artifact:
    name: Artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute artifact name
        id: name
        run: echo "value=biolume-PR-${{ github.event.pull_request.number }}-${{ github.event.pull_request.commits }}" >> "$GITHUB_OUTPUT"

      - name: Download packaged extension
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.vsix-artifact }}
          path: vsix

      - name: Upload PR artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.value }}
          path: vsix
          if-no-files-found: error

      - name: Comment artifact on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          ARTIFACT_NAME: ${{ steps.name.outputs.value }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        with:
          script: |
            const report = require('./.github/scripts/comment-pr.cjs');
            await report({ github, context });
