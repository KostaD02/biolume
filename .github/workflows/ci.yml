name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hub:
    permissions:
      contents: read
      pull-requests: write
    uses: KostaD02/ci/.github/workflows/ci.yml@v1
    with:
      build: pnpm run package
      artifact-path: dist/*.vsix
      artifact-prefix: biolume
      size-table: files
      footer: |
        ## 🧪 Try it

        Unzip the artifact, then run **Extensions: Install from VSIX...** in VS Code and pick the `.vsix` file.
