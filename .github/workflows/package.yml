name: Package

on:
  workflow_call:
    outputs:
      vsix-artifact:
        description: Name of the internal .vsix artifact uploaded by this workflow
        value: ${{ jobs.package.outputs.vsix-artifact }}

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      vsix-artifact: ${{ steps.vsix-name.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Package extension
        run: pnpm run package

      - name: Compute vsix artifact name
        id: vsix-name
        run: echo "name=vsix-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload vsix (internal)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vsix-name.outputs.name }}
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 1
